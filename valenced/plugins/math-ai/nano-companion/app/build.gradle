plugins { id 'com.android.application' }
android {
    namespace 'dev.fluttershy2008.mathnano'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'dev.fluttershy2008.mathnano'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { debug { debuggable false } }
}
configurations.configureEach {
    resolutionStrategy.eachDependency { detail ->
        if (detail.requested.group == 'org.jetbrains.kotlinx' && detail.requested.name.startsWith('kotlinx-coroutines')) detail.useVersion '1.11.0'
    }
}
dependencies {
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
