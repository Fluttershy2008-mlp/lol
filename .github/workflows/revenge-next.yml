name: Validate Revenge Next repository

on:
  push:
    paths:
      - 'revenge-next/**'
      - 'compatibility/user-profile*'
      - 'compatibility/expression-upload*'
      - 'save-as-sticker/**'
      - 'stealmoji/**'
      - 'index.json'
      - 'index.html'
      - '.nojekyll'
      - '**/manifest.json'
      - '**/index.js'
      - '**/index-v*.js'
      - '*Theme.json'
      - 'Rainbow_Dash_Sonic_Rainboom.json'
      - '.github/workflows/revenge-next.yml'
  pull_request:
    paths:
      - 'revenge-next/**'
      - 'compatibility/user-profile*'
      - 'compatibility/expression-upload*'
      - 'save-as-sticker/**'
      - 'stealmoji/**'
      - 'index.json'
      - 'index.html'
      - '.nojekyll'
      - '**/manifest.json'
      - '**/index.js'
      - '**/index-v*.js'
      - '*Theme.json'
      - 'Rainbow_Dash_Sonic_Rainboom.json'
      - '.github/workflows/revenge-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            revenge-next/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source build and regression dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic package output
        run: |
          node save-as-sticker/build.mjs
          node stealmoji/build.mjs
          node server-leaver/build.mjs
          node more-alts/build.mjs
          python3 revenge-next/build.py --check
      - name: Check Next adapter and plugin integration
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix revenge-next
          node --test revenge-next/tests/*.test.cjs
      - name: Check ZIP integrity and index metadata
        run: python3 -m unittest discover -s revenge-next/tests -p 'test_*.py'
      - name: Check profile opener and Classic regressions
        run: node --test compatibility/expression-upload.test.mjs save-as-sticker/tests/*.test.mjs stealmoji/tests/*.test.mjs compatibility/user-profile.test.mjs server-leaver/tests/*.test.mjs more-alts/tests/*.test.mjs friends-list/tests/*.test.mjs blocked-user-list/tests/*.test.mjs addonList/tests/*.test.mjs copy-user-id/tests/*.test.mjs info-commands/tests/runtime.test.mjs valid-user/tests/*.test.mjs
