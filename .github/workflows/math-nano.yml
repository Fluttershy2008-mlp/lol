name: Build Math Nano companion
on:
  push:
    paths:
      - 'valenced/plugins/math-ai/nano-companion/**'
      - '.github/workflows/math-nano.yml'
  pull_request:
    paths:
      - 'valenced/plugins/math-ai/nano-companion/**'
      - '.github/workflows/math-nano.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and package against the real ML Kit SDK
        run: gradle -p valenced/plugins/math-ai/nano-companion :app:assembleDebug :app:lintDebug --no-daemon --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: Math-Nano-companion-build
          path: valenced/plugins/math-ai/nano-companion/app/build/outputs/apk/debug/app-debug.apk
