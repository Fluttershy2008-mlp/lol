name: Validate Valenced repository

on:
  push:
    paths:
      - 'valenced/**'
      - 'revenge-next/tests/**'
      - 'revenge-next/LICENSE'
      - 'compatibility/user-profile*'
      - 'compatibility/expression-upload*'
      - 'compatibility/expression-panel*'
      - 'compatibility/expression-page*'
      - 'save-as-sticker/**'
      - 'stealmoji/**'
      - '**/manifest.json'
      - '**/index.js'
      - '**/index-v*.js'
      - '*Theme.json'
      - 'Rainbow_Dash_Sonic_Rainboom.json'
      - '.github/workflows/valenced.yml'
  pull_request:
    paths:
      - 'valenced/**'
      - 'revenge-next/tests/**'
      - 'revenge-next/LICENSE'
      - 'compatibility/user-profile*'
      - 'compatibility/expression-upload*'
      - 'compatibility/expression-panel*'
      - 'compatibility/expression-page*'
      - 'save-as-sticker/**'
      - 'stealmoji/**'
      - '**/manifest.json'
      - '**/index.js'
      - '**/index-v*.js'
      - '*Theme.json'
      - 'Rainbow_Dash_Sonic_Rainboom.json'
      - '.github/workflows/valenced.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            revenge-next/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source build and regression dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic package output
        run: |
          node save-as-sticker/build.mjs
          node stealmoji/build.mjs
          node server-leaver/build.mjs
          node more-alts/build.mjs
          python3 valenced/build.py --check
      - name: Check Valenced loader and plugin integration
        env:
          PLUGIN_TEST_TARGET: valenced
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix revenge-next
          node --test revenge-next/tests/plugins.test.cjs valenced/tests/*.test.cjs
          node --test --test-skip-pattern=InfoCommands revenge-next/tests/features.test.cjs
      - name: Check ZIP integrity and catalogue metadata
        run: python3 -m unittest discover -s valenced/tests -p 'test_*.py'
      - name: Check requested plugins' source regressions
        run: node --test compatibility/expression-upload.test.mjs save-as-sticker/tests/*.test.mjs stealmoji/tests/*.test.mjs compatibility/user-profile.test.mjs server-leaver/tests/*.test.mjs more-alts/tests/*.test.mjs friends-list/tests/*.test.mjs blocked-user-list/tests/*.test.mjs addonList/tests/*.test.mjs copy-user-id/tests/*.test.mjs auto-text/tests/*.test.mjs info-commands/tests/*.test.mjs valid-user/tests/*.test.mjs
